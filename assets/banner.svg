<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Glide: files at the speed of the pipe">
  <defs>
    <radialGradient id="glow" cx="78%" cy="52%" r="55%">
      <stop offset="0" stop-color="#FF4A12" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FF4A12" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#FF4A12" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFB15C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" x2="1">
      <stop offset="0" stop-color="#2A2A30" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2A2A30" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <path id="s1" d="M620 92 C 760 92, 860 220, 1010 220"/>
    <path id="s2" d="M620 168 C 760 168, 860 220, 1010 220"/>
    <path id="s3" d="M620 272 C 760 272, 860 220, 1010 220"/>
    <path id="s4" d="M620 348 C 760 348, 860 220, 1010 220"/>
    <path id="out" d="M1010 220 H 1300"/>
  </defs>

  <rect width="1280" height="440" fill="#09090B"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <!-- four streams -->
  <g fill="none" stroke="url(#fadeL)" stroke-width="1.5">
    <use href="#s1"/><use href="#s2"/><use href="#s3"/><use href="#s4"/>
  </g>
  <!-- merged pipe -->
  <path d="M1010 220 H 1280" stroke="url(#beam)" stroke-width="3" fill="none"/>
  <circle cx="1010" cy="220" r="5" fill="#FF4A12"/>
  <circle cx="1010" cy="220" r="14" fill="#FF4A12" fill-opacity="0.18"/>

  <!-- blocks in flight -->
  <g fill="#F5F5F7">
    <rect x="-6" y="-3" width="12" height="6" rx="2"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath href="#s1"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2" opacity="0.7"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" rotate="auto"><mpath href="#s1"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2"><animateMotion dur="2s" begin="-0.4s" repeatCount="indefinite" rotate="auto"><mpath href="#s2"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2" opacity="0.7"><animateMotion dur="2s" begin="-1.4s" repeatCount="indefinite" rotate="auto"><mpath href="#s2"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2"><animateMotion dur="2s" begin="-0.9s" repeatCount="indefinite" rotate="auto"><mpath href="#s3"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2" opacity="0.7"><animateMotion dur="2s" begin="-1.9s" repeatCount="indefinite" rotate="auto"><mpath href="#s3"/></animateMotion></rect>
    <rect x="-6" y="-3" width="12" height="6" rx="2"><animateMotion dur="3s" begin="-0.2s" repeatCount="indefinite" rotate="auto"><mpath href="#s4"/></animateMotion></rect>
  </g>
  <g fill="#FFB15C">
    <rect x="-8" y="-3" width="16" height="6" rx="2"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></rect>
    <rect x="-8" y="-3" width="16" height="6" rx="2" opacity="0.8"><animateMotion dur="1s" begin="-0.333s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></rect>
    <rect x="-8" y="-3" width="16" height="6" rx="2" opacity="0.6"><animateMotion dur="1s" begin="-0.667s" repeatCount="indefinite"><mpath href="#out"/></animateMotion></rect>
  </g>

  <!-- stream labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5C5C66" letter-spacing="0.5">
    <text x="620" y="80">WI-FI AWARE</text>
    <text x="620" y="156">MULTIPEER</text>
    <text x="620" y="260">USB-C</text>
    <text x="620" y="336">LIGHT</text>
  </g>

  <!-- logo -->
  <g transform="translate(280 103) scale(0.8) skewX(-10)"><defs><radialGradient id="bwg"><stop offset="0" stop-color="#FF7A3D" stop-opacity=".9"/><stop offset="1" stop-color="#FF4D1A" stop-opacity="0"/></radialGradient></defs><g fill="none" stroke="#F5F5F7" stroke-width="13" stroke-linejoin="miter"><path d="M4,132 H52 Q72,132 72,112 V48 Q72,40 64,40 H20 Q0,40 0,60 V80 Q0,100 20,100 H72"/><path d="M104,0 V100"/><path d="M136,40 V100"/><path d="M240,0 V92 Q240,100 232,100 H188 Q168,100 168,80 V60 Q168,40 188,40 H240"/><path d="M272,70 H344 V60 Q344,40 324,40 H292 Q272,40 272,60 V80 Q272,100 292,100 H340"/></g><circle cx="136" cy="14" r="22" fill="url(#bwg)"/><circle cx="136" cy="14" r="7" fill="#FFF3E8"/></g>
  <svg x="78" y="104" width="168" height="104" viewBox="24 56 232 144">
  <defs>
    <linearGradient id="mgw" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="216" y2="0"><stop offset="0" stop-color="#FF4A12" stop-opacity="0.02"/><stop offset="1" stop-color="#FF4A12" stop-opacity="0.30"/></linearGradient>
    <linearGradient id="mgs" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="216" y2="0"><stop offset="0" stop-color="#FF4A12" stop-opacity="0.12"/><stop offset="0.55" stop-color="#FF5A1C"/><stop offset="1" stop-color="#FFC890"/></linearGradient>
    <radialGradient id="mgt" gradientUnits="userSpaceOnUse" cx="214" cy="128" r="34"><stop offset="0" stop-color="#FFE7CC"/><stop offset="0.3" stop-color="#FF6A2A" stop-opacity="0.6"/><stop offset="1" stop-color="#FF4A12" stop-opacity="0"/></radialGradient>
  </defs>
  <path d="M40 76 C 120 86, 170 110, 214 128 C 170 146, 120 170, 40 180 C 86 158, 112 142, 124 128 C 112 114, 86 98, 40 76 Z" fill="url(#mgw)"/>
  <g fill="none" stroke="url(#mgs)" stroke-linecap="round">
    <path d="M40 76 C 120 86, 170 110, 214 128" stroke-width="13"/>
    <path d="M40 180 C 120 170, 170 146, 214 128" stroke-width="13"/>
    <path d="M100 128 L 214 128" stroke-width="9"/>
  </g>
  <circle cx="214" cy="128" r="34" fill="url(#mgt)"/>
  <circle cx="214" cy="128" r="8" fill="#FFF4E8"/>

  </svg>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="92" y="262" font-size="30" font-weight="400" letter-spacing="-0.6" fill="#A1A1AA">Files at the speed of the pipe.</text>
  </g>
  <text x="92" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.5" fill="#5C5C66">ANY STREAM · MANY AT ONCE · NO INTERNET</text>
</svg>
