[workspace]
resolver = "2"
members = ["crates/glide-core", "crates/glide", "crates/glide-cli"]
exclude = ["crates/glide-wasm"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GuusLab/Glide"
authors = ["GuusLab <guus@guuslab.com>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
