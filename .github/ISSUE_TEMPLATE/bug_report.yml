name: Bug report
description: Something in Glide does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. Report them privately, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The exact commands on both sides, or the smallest piece of code that shows it.
      render: console
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0 or a commit hash
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platforms
      description: Operating system and architecture of the sender and the receiver, or the browser for the WASM build.
      placeholder: "sender: macOS 15 arm64, receiver: Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Connections
      description: How many streams, and over what (Wi-Fi, Ethernet, a relay, the same machine).
