name: Feature or protocol idea
description: Propose something Glide should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Glide makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like to see. A rough sketch is enough.
    validations:
      required: true
  - type: dropdown
    id: wire
    attributes:
      label: Does it change the wire protocol?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including ones that need no change to Glide.
