# Version updates stay within what Cargo already considers compatible. A breaking
# release of a crypto or wire-format crate is a decision to take by hand, not a
# monthly pull request. Security updates are separate and are not limited by this.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # bincode 3.0.0 is an intentionally uncompilable tombstone release.
      - dependency-name: bincode
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /crates/glide-wasm
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: bincode
    groups:
      cargo-wasm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
