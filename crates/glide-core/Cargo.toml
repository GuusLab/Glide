[package]
name = "glide-core"
description = "Sans-I/O wire format and bulk crypto of the Glide file transfer protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3 = { version = "1", default-features = false }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
